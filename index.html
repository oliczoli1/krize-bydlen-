<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="page">


  <!-- =========================
       HEADER
  ========================= -->

  <div class="header">

    <div class="label">
      SLOVNÍ ZÁSOBA · B2/C1
    </div>

    <h1>
      Bydlení a život mladých
    </h1>
  </div>


  <!-- =========================
       CVIČENÍ 1
  ========================= -->

  <section class="lesson-section">

    <div class="section-number">
      Cvičení 1
    </div>

    <h2>
      Spoj slovo s významem
    </h2>

    <p class="section-description">
      Klikni na výraz a potom na jeho správný význam.
    </p>


    <div class="progress-wrapper">

      <div class="progress-info">

        <span>Pokrok</span>

        <span id="progressText">
          0 / 16
        </span>

      </div>

      <div class="progress-background">

        <div
          class="progress"
          id="progressBar">
        </div>

      </div>

    </div>


    <div class="exercise">

      <div class="columns">

        <div>

          <div class="column-title">
            Výrazy
          </div>

          <div id="words"></div>

        </div>


        <div>

          <div class="column-title">
            Významy
          </div>

          <div id="definitions"></div>

        </div>

      </div>


      <div
        id="feedback"
        class="feedback">
      </div>


      <div
        id="finished"
        class="finished">

        <strong>Výborně.</strong>
        Všechny výrazy jsou správně spojené.

        <br>

        <button
          class="restart"
          id="restart">
          Zkusit znovu
        </button>

      </div>
    </div>

  </section>



  <!-- =========================
       CVIČENÍ 2
  ========================= -->

  <section class="lesson-section">

    <div class="section-number">
      Cvičení 2
    </div>

    <h2>
      Vyber správný výraz
    </h2>

    <p class="section-description">
      Doplň do každé věty správné slovo nebo výraz.
    </p>


    <div
      id="sentences"
      class="sentences">
    </div>


    <div
      id="result"
      class="result">

      <div
        id="resultScore"
        class="result-score">
      </div>

      <div
        id="resultText"
        class="result-text">
      </div>

      <button
        id="restartSecond"
        class="restart-second">
        Zkusit znovu
      </button>

    </div>

  </section>


</div>



<script src="script.js"></script>

</body>
</html>
